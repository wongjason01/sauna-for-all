# Worker config for the main site, so Cloudflare Workers Builds can deploy it
# straight from this repo instead of the manual "upload dist/ in the dashboard"
# flow described at the top of prepare_deploy.py.
#
# `name` must match the existing Worker in the Cloudflare account, so builds
# deploy over the same Worker (and keep any custom domain attached to it)
# rather than creating a second one.
#
# Build settings to set in the dashboard (Workers & Pages > sauna-for-all >
# Settings > Builds):
#   Build command:  python3 build.py && python3 prepare_deploy.py
#   Deploy command: npx wrangler deploy
#   Root directory: /
#
# Both scripts are standard library only, so there's nothing to pip install.
# Cloudflare's build image ships Python 3.13. build.py fetches the live
# signatories sheet during the build; if that fetch fails it falls back to the
# committed snapshot in data/signatories_live.csv, so a build never publishes
# an empty directory.

name = "sauna-for-all"
compatibility_date = "2026-09-20"

# dist/ is generated by prepare_deploy.py during the build (it's gitignored,
# so it isn't committed -- Workers Builds creates it each time).
[assets]
directory = "./dist"
